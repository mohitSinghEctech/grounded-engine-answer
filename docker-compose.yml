services:
  qdrant:
    image: qdrant/qdrant:v1.16.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  llm-gateway:
    build: ./services/llm-gateway
    image: llm-gateway:dev
    env_file:
      - ./services/llm-gateway/.env
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: INFO
    expose:
      - "8000"
    restart: unless-stopped

  tax-agent:
    build: ./services/tax-agent
    image: tax-agent:dev
    env_file:
      - ./services/tax-agent/.env
    environment:
      LLM_GATEWAY_URL: http://llm-gateway:8000
      QDRANT_URL: http://qdrant:6333
      ENVIRONMENT: development
    ports:
      - "8080:8080"
    depends_on:
      llm-gateway:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

volumes:
  qdrant_storage: