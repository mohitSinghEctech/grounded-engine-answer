# Evaluation set v1 - 40 questions.
#
# verify: true  means the expected sections were inferred from section titles
#               rather than read in full. Check these before trusting a score.
#
# tax_year is the STARTING year of the financial year: FY 2026-27 -> 2026.
# The 1961 Act governs through 2025; the 2025 Act from 2026.

meta:
  version: 1
  corpus_date: "2026-09-14"
  collections: [ita_sections, ita_naive]

questions:

  # --- exact-fact: one provision, one specific figure or condition ---------

  - id: EF-01
    category: exact-fact
    question: "What is the maximum deduction allowed for life insurance premium under the Income-tax Act 2025?"
    tax_year: 2027
    expected_acts: [ITA-2025]
    expected_sections: ["123"]
    # Indian notation, as the Act prints it. Rule 5 requires figures quoted
    # exactly, so "150000" would fail a correct answer: the first run
    # answered "₹1,50,000" and scored contains_expected false.
    answer_contains: ["1,50,000"]
    should_refuse: false
    verify: false

  - id: EF-02
    category: exact-fact
    question: "Under the 1961 Act, which section allows a deduction for health insurance premium?"
    tax_year: 2024
    expected_acts: [ITA-1961]
    expected_sections: ["80D"]
    should_refuse: false
    verify: false

  - id: EF-03
    category: exact-fact
    question: "What deduction is available for rent paid by a self-employed person under the 1961 Act?"
    tax_year: 2024
    expected_acts: [ITA-1961]
    expected_sections: ["80GG"]
    should_refuse: false
    verify: false

  - id: EF-04
    category: exact-fact
    question: "Which section of the 1961 Act deals with deduction for interest on deposits in a savings account?"
    tax_year: 2024
