    should_refuse: false
    verify: false

  - id: EF-05
    category: exact-fact
    question: "What does the Income-tax Act 2025 define as a tax year?"
    tax_year: 2027
    expected_acts: [ITA-2025]
    expected_sections: ["3"]
    answer_contains: ["twelve months", "financial year"]
    should_refuse: false
    verify: false

  - id: EF-06
    category: exact-fact
    question: "Under the 1961 Act, what is the penalty for under-reporting of income?"
    tax_year: 2024
    expected_acts: [ITA-1961]
