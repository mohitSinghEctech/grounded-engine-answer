    tax_year: null
    expected_acts: [ITA-1961, ITA-2025]
    expected_sections: ["139"]
    should_refuse: false
    verify: true
    note: >
      Deliberately ambiguous. s.139 is Return of income in 1961 and
      Deductions for undertakings in 2025. A good answer names both, or asks
      which year. A bad one silently picks.

